name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual "Run workflow" from GitHub

# Never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (wrangler)
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Type-check (app + worker)
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      # Four Workers (docs/HOSTING.md). The sites go first: a deploy removes
      # any address its config no longer lists, so the API must not let go of
      # an address before the site that now owns it has taken it over.
      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          { npm run deploy:sites && npm run deploy:api; } > deploy_output.txt 2>&1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deploy result
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "=== DEPLOY FAILED, full error: ==="
            cat deploy_output.txt
            ERRS=$(grep -i -m 6 -E "ERROR|failed|unauthorized|forbidden|not authorized|✘" deploy_output.txt | tr -d '\r' | head -c 900 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$ERRS"
            exit 1
          else
            echo "=== DEPLOY SUCCEEDED ==="
            tail -n 20 deploy_output.txt
          fi
