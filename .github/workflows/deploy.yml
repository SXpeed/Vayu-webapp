name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual "Run workflow" from GitHub

# Never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies (wrangler)
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: npx wrangler deploy > deploy_output.txt 2>&1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deploy result
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "=== DEPLOY FAILED, full error: ==="
            cat deploy_output.txt
            MSG=$(tail -c 700 deploy_output.txt | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$MSG"
            exit 1
          else
            echo "=== DEPLOY SUCCEEDED ==="
            tail -n 20 deploy_output.txt
          fi
