<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Single theme-color; the inline theme script below keeps it in sync
         with the user's app-level theme preference (from localStorage). -->
    <meta name="theme-color" content="#e9edf4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- `default`, not `black-translucent`: with the translucent bar, iOS drew
         the installed app from the very top of the screen but sized it as if
         the status bar were solid, leaving an undrawable strip (a status bar's
         height) below the nav bar. With `default` the view starts below the
         status bar and reaches the bottom edge; the bar takes theme-color,
         which matches the app background. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ateliersupport">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ateliersupport</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <!-- The platform logo on the app's light page colour, not on black: the
         phone builds its launch screen from these before any of our code
         runs, so they must match the loading screen that follows. ?v= makes
         phones fetch them again after a change (iOS caches icons by address). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png?v=2">

    <script>
        // Apply theme immediately to prevent flash during React mount
        try {
            const savedTheme = localStorage.getItem('vayu_theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#22252b');
            } else {
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9edf4');
            }
        } catch (e) {
            console.warn('Failed to apply theme', e);
        }
        // UI size, before first paint (see "UI size" in index.css and uiSize.ts).
        (function () {
            let size = 'default';
            try { size = localStorage.getItem('vayu_ui_size') || size; } catch { /* private mode */ }
            const zoom = { small: 0.9, default: 0.95, large: 1 }[size] || 0.95;
            document.documentElement.style.setProperty('--ui-zoom', String(zoom));
        })();
    </script>

    <style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        /* ===== iOS / iPhone Optimizations ===== */

        html {
            /* Prevent overscroll bounce / rubber-banding on iOS.
               `none` is stronger than `contain` and stops the top-overscroll
               that was revealing blank space below the app shell. */
            overscroll-behavior: none;
            /* Fix the layout viewport so it can't be shifted by overscroll. */
            position: fixed;
            width: 100%;
            height: var(--app-height, 100dvh);
            overflow: hidden;
        }

        body {
            /* Same as --neu-bg, so nothing behind the shell ever reads as a band */
            background-color: #e9edf4;
            margin: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Prevent text selection on long-press (iOS) */
            -webkit-user-select: none;
            user-select: none;
            /* Prevent iOS callout on long-press */
            -webkit-touch-callout: none;
            /* Prevent pull-to-refresh and scroll-chaining to the root */
            overscroll-behavior: contain;
            /* Prevent native pinch-zoom across the UI */
            touch-action: pan-x pan-y;
            /* Keep the body inside the fixed html viewport. Divided by the
               UI-size zoom, which applies to body (index.css). */
            position: fixed;
            width: 100%;
            height: calc(var(--app-height, 100dvh) / var(--ui-zoom, 1));
            overflow: hidden;
        }

        /* Allow text selection in inputs/textareas */
        input,
        textarea,
        [contenteditable] {
            -webkit-user-select: text;
            user-select: text;
        }

        /* Dark mode fallback for body before React loads */
        html.dark body {
            background-color: #22252b;
        }

        /* Prevent double-tap-to-zoom completely on the app
           (merged into the primary `body` rule at line 73 to avoid duplicate selector) */

        /* Prevent iOS zoom on input focus (font-size must be >= 16px) */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="search"],
        input[type="password"],
        input[type="date"],
        input[type="time"],
        input[type="datetime-local"],
        textarea,
        select {
            font-size: 16px !important;
        }

        /* 
         * Safe area: When running as standalone PWA on iPhone with notch/Dynamic Island,
         * add extra top padding to all headers that use pt-8 to account for the notch.
         * This is applied via CSS so no component changes are needed.
         */
        @supports (padding-top: env(safe-area-inset-top)) {
            @media all and (display-mode: standalone),
            all and (display-mode: fullscreen) {

                /* Boost header padding for safe area on iPhone */
                .pt-8 {
                    padding-top: calc(2rem + var(--safe-top)) !important;
                }

                /* Ensure bottom nav doesn't overlap the home indicator */
                .pb-safe-auto {
                    padding-bottom: var(--safe-bottom-ui) !important;
                }
            }
        }

        /* Custom Animations — quick and light. Content should feel *there*
         * the moment you tap: entrances were 0.5–0.7s with per-card
         * staggers up to ~0.5s, so a list took over a second to settle
         * (measured ~1s to the 6th card at 4x CPU throttle). */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.995);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* `animation-delay` is pinned to 0: views set inline staggers (up to
         * `400ms + index * 50ms`), which only postponed content. !important
         * is what lets a stylesheet win over those inline styles. */
        .animate-fade-in-up {
            animation: fadeInUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0ms !important;
            opacity: 0;
        }

        .animate-fade-in {
            animation: fadeIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0ms !important;
            opacity: 0;
        }

        .animate-scale-in {
            animation: scaleIn 0.26s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
            animation-delay: 0ms !important;
            opacity: 0;
        }

        .active-scale {
            /* Smooth, springy press feedback: the :active scale applies
               instantly (no delay on press); the release eases back with a
               soft spring so taps feel fluid and substantial. */
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .active-scale:active {
            transform: scale(0.94);
            transition: transform 0.08s ease-out;
        }

        /* Remove any residual double-tap-zoom tap delay on interactive
           elements so single taps register immediately on touch devices. */
        button,
        a,
        select,
        [role="button"] {
            touch-action: manipulation;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- Service Worker Registration for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            // When an UPDATED service worker takes control (a new app version),
            // reload once so the running page picks up the new bundle instead
            // of staying on the old one until the next cold start. The
            // hadController guard keeps the very first install (no controller
            // yet) from causing an unnecessary reload.
            let refreshing = false;
            let hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController) { hadController = true; return; }
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });

            const registerSw = () => {
                navigator.serviceWorker.register('./sw.js').then(onSwRegistered, onSwError);
            };

            const cleanupAndRegister = () => {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                    // Only unregister service workers that are NOT our current sw.js
                    // (e.g. old ones from different scopes) to avoid killing the
                    // active worker on every page load.
                    const unregisterPromises = registrations
                        .filter((reg) => !reg.active || !reg.active.scriptURL.includes('sw.js'))
                        .map((reg) => reg.unregister());
                    Promise.all(unregisterPromises).then(registerSw);
                });
            };

            const onSwRegistered = (registration) => {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);

                // Home-screen launches usually RESUME the old session without a
                // navigation, so the browser never checks for updates on its own.
                // Force an update check whenever the app becomes visible again
                // (new worker -> installs -> activates -> controllerchange above
                // reloads the page).
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        registration.update().catch(() => { /* offline — ignore */ });
                    }
                });
            };

            const onSwError = (err) => {
                console.log('ServiceWorker registration failed: ', err);
            };

            window.addEventListener('load', cleanupAndRegister);
        }

        /*
         * Keyboard / visualViewport fix for iOS Safari.
         *
         * On iOS, when the soft keyboard opens, the *layout* viewport (and
         * therefore `100vh` / `100dvh`) does NOT shrink — only the *visual*
         * viewport does. This creates a gap between the app content and the
         * keyboard. We listen to `window.visualViewport` and set a CSS custom
         * property `--app-height` that tracks the actual visible height, then
         * the app shell uses it instead of `100dvh`.
         */
        (function () {
            // --app-height: set only while the keyboard is open, pinning the app
            // to the visual viewport (iOS doesn't shrink the layout viewport).
            // Otherwise html/body/#root simply fill the viewport (100%).
            //
            // --safe-bottom: the bottom inset every nav bar / page bottom uses.
            // Normally it's just env(safe-area-inset-bottom). But on some
            // iPhones the installed app is given a view shorter than the screen
            // (short by about a status bar), and the strip below it can't be
            // drawn into; content placed there is clipped. The home indicator
            // then sits mostly or entirely *outside* the app's view, yet iOS
            // still reports the full ~34pt inset, which pushed the nav bar up
            // and left dead space. So when the view is short, only count the
            // part of the home-indicator area that actually overlaps it.
            //
            // Add ?vpdebug to the URL to show the measured values on screen.
            const debug = new URLSearchParams(globalThis.location.search).has('vpdebug');
            let insetProbe = null;
            function safeInsets() {
                if (!insetProbe) {
                    insetProbe = document.createElement('div');
                    insetProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:100dvh;box-sizing:content-box;visibility:hidden;pointer-events:none;'
                        + 'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
                    document.documentElement.appendChild(insetProbe);
                }
                const cs = getComputedStyle(insetProbe);
                return {
                    top: Number.parseFloat(cs.paddingTop) || 0,
                    bottom: Number.parseFloat(cs.paddingBottom) || 0,
                    // What 100dvh resolves to: if iOS lets the view reach past
                    // innerHeight, this is the real height to measure against.
                    dvh: Number.parseFloat(cs.height) || 0,
                };
            }
            /** How far the app's view falls short of the physical screen (installed iPhone app only). */
            function viewShortfall(insets) {
                if (globalThis.navigator.standalone !== true) return 0;
                // No top inset means the view already starts below the status
                // bar, so being shorter than the screen is expected, not a bug.
                if (insets.top < 1) return 0;
                const portrait = globalThis.innerHeight >= globalThis.innerWidth;
                const s = portrait
                    ? Math.max(globalThis.screen.width, globalThis.screen.height)
                    : Math.min(globalThis.screen.width, globalThis.screen.height);
                const shortBy = s - Math.max(globalThis.innerHeight, insets.dvh);
                return shortBy > 0 && shortBy <= 120 ? shortBy : 0;
            }
            /** A field that brings up the on-screen keyboard. */
            function typingInto(el) {
                if (!el) return false;
                if (el.isContentEditable || el.tagName === 'TEXTAREA') return true;
                return el.tagName === 'INPUT'
                    && !/^(button|checkbox|color|file|hidden|image|radio|range|reset|submit)$/i.test(el.type);
            }
            // Visible height with no keyboard, per viewport width (a rotation
            // changes the width; the keyboard never does). Measured whenever
            // nothing is being typed into.
            const fullHeight = {};
            /**
             * Whether the on-screen keyboard is up. iOS normally leaves the
             * layout viewport (innerHeight) full and shrinks only the visual
             * one. But installed iPhone apps sometimes shrink innerHeight too,
             * and Android resizes it by design (interactive-widget), so also
             * compare with the full height seen before typing began.
             */
            function keyboardIsOpen(vv) {
                // A pinch-zoom also shrinks the visual viewport, but with scale > 1.
                // Treating that as the keyboard shrank the whole app to the
                // zoomed height and left the rest of the page blank.
                if (!vv || vv.scale >= 1.01) return false;
                const key = Math.round(globalThis.innerWidth);
                const typing = typingInto(document.activeElement);
                if (!typing || !fullHeight[key]) fullHeight[key] = vv.height;
                if (globalThis.innerHeight - vv.height > 120) return true;
                return typing && fullHeight[key] - vv.height > 120;
            }
            function setAppHeight() {
                const root = document.documentElement;
                const vv = globalThis.visualViewport;
                const keyboardOpen = keyboardIsOpen(vv);
                const h = keyboardOpen ? vv.height : null;
                if (h) {
                    root.style.setProperty('--app-height', h + 'px');
                    // iOS reveals a focused field by panning the visual
                    // viewport down over the (unshrunk) layout viewport, which
                    // carries the fixed app up and its header off screen.
                    // Follow the pan instead of snapping it back: the app sits
                    // exactly in the visible strip whatever iOS does.
                    root.style.setProperty('--app-top', Math.max(0, vv.offsetTop) + 'px');
                } else {
                    root.style.removeProperty('--app-height');
                    root.style.removeProperty('--app-top');
                }
                // Lets CSS drop what only makes sense without a keyboard —
                // the dock, which would otherwise ride on top of it.
                root.classList.toggle('kb-open', keyboardOpen);

                const insets = safeInsets();
                const shortBy = keyboardOpen ? 0 : viewShortfall(insets);
                // The keyboard covers the home indicator, so nothing needs to
                // clear it: a message bar sits right on the keyboard.
                let safeBottom = shortBy > 0 ? Math.max(0, insets.bottom - shortBy) : null;
                if (keyboardOpen) safeBottom = 0;
                if (safeBottom === null) {
                    root.style.removeProperty('--safe-bottom');
                } else {
                    root.style.setProperty('--safe-bottom', safeBottom + 'px');
                }
                if (debug) showDebug({ vv, insets, shortBy, h, safeBottom, keyboardOpen });
                if (globalThis.scrollY > 0) {
                    globalThis.scrollTo(0, 0);
                }
            }
            /** ?vpdebug readout, pinned under the status bar. */
            function showDebug(m) {
                const lines = [
                    'innerH ' + globalThis.innerHeight + '  vvH ' + (m.vv ? Math.round(m.vv.height) : '-') + '  100dvh ' + Math.round(m.insets.dvh),
                    'screen ' + globalThis.screen.width + 'x' + globalThis.screen.height
                        + '  standalone ' + (globalThis.navigator.standalone === true),
                    'inset top ' + m.insets.top + '  bottom ' + m.insets.bottom + '  short by ' + m.shortBy,
                    '--app-height ' + (m.h ? m.h + 'px' : 'unset (100%)') + (m.keyboardOpen ? '  [keyboard]' : '')
                        + '  vvTop ' + (m.vv ? Math.round(m.vv.offsetTop) : '-') + '  scrollY ' + Math.round(globalThis.scrollY),
                    '--safe-bottom ' + (m.safeBottom === null ? 'unset (env)' : m.safeBottom + 'px'),
                ];
                let el = document.getElementById('vp-debug');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'vp-debug';
                    el.style.cssText = 'position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 4px);z-index:99999;font:11px/1.35 monospace;background:rgba(0,0,0,.75);color:#0f0;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:pre';
                    (document.body || document.documentElement).appendChild(el);
                }
                el.textContent = lines.join('\n');
            }
            setAppHeight();
            if (debug) document.addEventListener('DOMContentLoaded', setAppHeight);
            if (globalThis.visualViewport) {
                globalThis.visualViewport.addEventListener('resize', setAppHeight);
                globalThis.visualViewport.addEventListener('scroll', setAppHeight);
            }
            globalThis.addEventListener('resize', setAppHeight);
            // Leaving a field can close the keyboard before any resize says
            // so; check again once focus has settled.
            document.addEventListener('focusin', setAppHeight);
            document.addEventListener('focusout', function () {
                setTimeout(setAppHeight, 60);
                setTimeout(setAppHeight, 350);
            });
            globalThis.addEventListener('orientationchange', function () {
                setTimeout(setAppHeight, 200);
            });
        })();
    </script>

    <!-- Orientation lock: uses top-level await, so this script is a module -->
    <script type="module">
        function isStandalone() {
            return globalThis.matchMedia('(display-mode: standalone)').matches
                || globalThis.matchMedia('(display-mode: fullscreen)').matches
                || globalThis.navigator.standalone === true;
        }

        // NOTE: We do NOT use the Fullscreen API here — on iOS Safari,
        // requestFullscreen() hides the native status bar. In standalone
        // mode the app is already full-screen with the status bar visible
        // on top, which is the desired behaviour.
        if (isStandalone() && screen.orientation?.lock) {
            try {
                await screen.orientation.lock('portrait');
            } catch (e) {
                console.warn('Orientation lock skipped', e);
            }
        }
    </script>
</body>

</html>
